<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CajeBank - Retiro de Efectivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #ffffff; }
        .bg-dots {
            background-image: radial-gradient(#1b5e20 3px, transparent 3px);
            background-size: 35px 35px;
        }
        .bg-stripes {
            background-image: repeating-linear-gradient(45deg, transparent, transparent 4px, #8ba891 4px, #8ba891 5px);
        }
    </style>
</head>
<body class="h-screen flex flex-col font-sans overflow-hidden">

    <!-- HEADER -->
    <header class="bg-[#194f2b] text-white px-8 py-4 flex items-center justify-between z-10 relative">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-full border-[3px] border-black flex items-center justify-center bg-[#194f2b]">
                <span class="text-black text-3xl font-medium">$</span>
            </div>
            <h1 class="text-[2.5rem] font-bold tracking-wide">CajeBank</h1>
        </div>
        <div class="text-[1.3rem] tracking-wide uppercase">
            Retiro de Efectivo
        </div>
    </header>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 relative flex flex-col items-center w-full pt-8">
        <!-- DECORACIONES DE FONDO -->
        <div class="absolute top-0 left-0 w-80 h-40 bg-stripes" style="clip-path: ellipse(100% 100% at 0% 0%);"></div>
        <div class="absolute top-6 right-6 w-48 h-24 bg-dots opacity-80"></div>
        <div class="absolute bottom-6 left-6 w-64 h-32 bg-dots opacity-80"></div>

        <!-- TÍTULO CENTRAL -->
        <div class="bg-[#1b8a47] text-white text-[2.2rem] font-bold rounded-xl py-3 px-16 z-10 mb-10 mt-2 shadow-md">
            Seleccione el monto a retirar
        </div>

        <!-- CONTENEDOR DEL MENÚ -->
        <div class="w-full flex justify-between items-center z-10 relative mt-4">

            <!-- Columna Izquierda -->
            <div class="flex flex-col gap-6 w-[42vw] max-w-[600px]">
                <button id="btn-1" class="bg-[#009c4a] text-white text-[2.5rem] font-bold py-4 px-6 w-full flex items-center transition-transform duration-150 active:scale-[0.98]">
                    <span class="w-12 text-left text-[2rem]">1.</span>
                    <span class="flex-1 text-center pr-12">$ 10.00</span>
                </button>
                <button id="btn-2" class="bg-[#009c4a] text-white text-[2.5rem] font-bold py-4 px-6 w-full flex items-center transition-transform duration-150 active:scale-[0.98]">
                    <span class="w-12 text-left text-[2rem]">2.</span>
                    <span class="flex-1 text-center pr-12">$ 20.00</span>
                </button>
                <button id="btn-3" class="bg-[#009c4a] text-white text-[2.5rem] font-bold py-4 px-6 w-full flex items-center transition-transform duration-150 active:scale-[0.98]">
                    <span class="w-12 text-left text-[2rem]">3.</span>
                    <span class="flex-1 text-center pr-12">$ 50.00</span>
                </button>
            </div>

            <!-- Icono Central (Billetes) -->
            <div class="flex justify-center absolute left-1/2 transform -translate-x-1/2 opacity-30 mt-6 pointer-events-none">
                <svg class="w-[250px] h-[250px] text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                    <circle cx="12" cy="12" r="2"></circle>
                    <path d="M6 12h.01M18 12h.01"></path>
                </svg>
            </div>

            <!-- Columna Derecha -->
            <div class="flex flex-col gap-6 w-[42vw] max-w-[600px]">
                <button id="btn-4" class="bg-[#009c4a] text-white text-[2.5rem] font-bold py-4 px-6 w-full flex items-center transition-transform duration-150 active:scale-[0.98]">
                    <span class="flex-1 text-center pl-12">$ 100.00</span>
                    <span class="w-12 text-right text-[2rem]">4.</span>
                </button>
                <button id="btn-5" class="bg-[#009c4a] text-white text-[2.5rem] font-bold py-4 px-6 w-full flex items-center transition-transform duration-150 active:scale-[0.98]">
                    <span class="flex-1 text-center pl-12">Otro valor</span>
                    <span class="w-12 text-right text-[2rem]">5.</span>
                </button>
                <button id="btn-6" class="bg-[#009c4a] text-white text-[2.2rem] font-bold py-4 px-6 w-full flex items-center transition-transform duration-150 active:scale-[0.98]">
                    <span class="flex-1 text-center pl-12">Cancelar Operación</span>
                    <span class="w-12 text-right text-[2rem]">6.</span>
                </button>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#194f2b] text-white px-8 py-3 flex items-center justify-between text-sm z-10 relative mt-auto">
        <div class="text-xl font-bold">CajeBank</div>
        <div class="text-right leading-tight">
            <p>© 2026 Sistema de Cajero</p>
            <p>Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- LÓGICA DE TECLADO Y PETICIÓN AJAX -->
    <script>
        // Mapeo de teclas a montos
        const montos = {
            '1': 10.00,
            '2': 20.00,
            '3': 50.00,
            '4': 100.00,
            '5': 200.00
        };

        function simulateButtonPress(buttonId) {
            const btn = document.getElementById(buttonId);
            if (btn) {
                btn.classList.add('bg-[#00e676]');
                setTimeout(() => { btn.classList.remove('bg-[#00e676]'); }, 150);
            }
        }

        let procesando = false;

        document.addEventListener('keydown', function(event) {
            const key = event.key;

            if (procesando) return; 

            if (key >= '1' && key <= '4') {
                simulateButtonPress(`btn-${key}`);
                procesando = true;
                const monto = montos[key];
                
                fetch('/api/procesar_retiro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ monto: monto })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert(data.message); 
                        window.location.href = '/saldo_movimientos'; 
                    } else {
                        alert("Error: " + data.message);
                        procesando = false;
                    }
                });
            } 
            else if (key === '5') {
                simulateButtonPress('btn-5');
                setTimeout(() => { window.location.href = '/otro_valor'; }, 200); 
            }
            else if (key === '6' || key === 'Escape') {
                simulateButtonPress('btn-6');
                setTimeout(() => { window.location.href = '/menu'; }, 200); 
            }

        });
    </script>
</body>
</html>
