<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CajeBank - Ingrese su PIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-dots {
            background-image: radial-gradient(#2d6a4f 2px, transparent 2px);
            background-size: 30px 30px;
        }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans overflow-hidden">
    <!-- HEADER -->
    <header class="bg-[#1b5e20] text-white px-8 py-5 flex items-center justify-between shadow-md z-10">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-full border-2 border-black flex items-center justify-center bg-[#1b5e20]">
                <span class="text-black text-2xl font-bold">$</span>
            </div>
            <h1 class="text-4xl font-bold tracking-wide">CajeBank</h1>
        </div>
        <div class="text-xl tracking-wider font-medium uppercase">
            Autenticación Requerida
        </div>
    </header>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 relative flex flex-col items-center justify-center">
        <!-- Decoraciones -->
        <div class="absolute top-0 left-0 w-64 h-64 bg-dots opacity-20" style="clip-path: circle(50% at 0 0);"></div>
        <div class="absolute bottom-10 right-10 w-48 h-32 bg-dots opacity-30"></div>

        <!-- TARJETA DE PIN -->
        <div class="bg-[#1e8b4d] rounded-2xl p-8 w-full max-w-md shadow-2xl z-10 border border-[#1b5e20]">
            <h2 class="text-white text-3xl font-bold text-center mb-6 tracking-wide border-b border-[#2d6a4f] pb-4">INGRESE SU PIN</h2>
            
            <input type="password" id="pin-input" readonly
                class="w-full py-4 px-4 rounded-xl text-gray-800 text-3xl focus:outline-none mb-6 shadow-inner text-center font-mono tracking-widest cursor-default"
                placeholder="****">
            
            <button id="btn-ingresar" 
                class="w-full bg-[#00c853] hover:bg-[#00e676] text-white font-bold text-xl py-4 rounded-full shadow-lg transition-transform duration-150 active:scale-95">
                VALIDAR
            </button>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#1b5e20] text-white px-8 py-4 flex items-center justify-between text-sm shadow-inner z-10 absolute bottom-0 w-full">
        <div class="text-xl font-bold">CajeBank</div>
        <div class="text-right">
            <p>© 2026 Sistema de Cajero</p>
            <p>Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- LÓGICA DE TECLADO Y PETICIÓN HTTP -->
    <script>
        let currentInput = "";
        const inputField = document.getElementById('pin-input');
        const btnIngresar = document.getElementById('btn-ingresar');

        function simulateEnterClick() {
            btnIngresar.classList.add('scale-95', 'bg-[#00e676]');
            setTimeout(() => { btnIngresar.classList.remove('scale-95', 'bg-[#00e676]'); }, 150);
        }

        document.addEventListener('keydown', function(event) {
            const key = event.key;

            if (key === 'Backspace') event.preventDefault();

            if (key >= '0' && key <= '9') {
                if (currentInput.length < 4) { // Límite de 4 dígitos para el PIN
                    currentInput += key;
                    inputField.value = currentInput;
                }
            } 
            else if (key === 'Enter') {
                if (currentInput.length > 0) {
                    simulateEnterClick();
                    
                    fetch('/api/validar_pin', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pin: currentInput })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            // PIN correcto
                            window.location.href = data.redirect;
                        } else {
                            // PIN incorrecto o bloqueado
                            alert(data.message);
                            if (data.message.includes('BLOQUEADA')) {
                                window.location.href = '/'; 
                            } else {
                                currentInput = "";
                                inputField.value = "";
                            }
                        }
                    })
                    .catch(error => console.error('Error:', error));
                }
            } 
            else if (key === 'Backspace') {
                currentInput = currentInput.slice(0, -1);
                inputField.value = currentInput;
            } 
            else if (key === 'Escape') {
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
