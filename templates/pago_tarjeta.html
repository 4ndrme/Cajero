<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CajeBank - Pago de Tarjeta de Crédito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .bg-grid {
            background-size: 30px 30px;
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-slate-900 h-screen flex flex-col justify-between overflow-hidden relative bg-grid select-none">

    <!-- LUCES DE FONDO AMBIENTALES -->
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-emerald-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-teal-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- HEADER -->
    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700/60 text-white px-10 py-4 flex items-center justify-between z-10 shadow-lg shrink-0">
        <div class="flex items-center gap-4">
            <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-900/40 border border-emerald-300/30">
                <span class="text-white text-2xl font-extrabold">$</span>
            </div>
            <div>
                <h1 class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-300">CajeBank</h1>
                <p class="text-xs text-emerald-400 font-semibold tracking-widest uppercase">Red de Cajeros Multibanco</p>
            </div>
        </div>
        <div class="flex items-center gap-3 bg-slate-900/60 border border-slate-700/50 px-4 py-2 rounded-full text-xs font-semibold text-slate-300">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>OPERATIVO</span>
        </div>
    </header>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 flex flex-col items-center justify-center px-6 py-4 z-10">
        <div class="w-full max-w-2xl glass-card rounded-3xl p-8 shadow-2xl border border-white/20 flex flex-col items-center relative">
            
            <div class="text-center mb-6">
                <span id="badge-pantalla" class="text-xs font-bold uppercase tracking-widest text-emerald-700 bg-emerald-100 px-3.5 py-1.5 rounded-full transition-colors">
                    Pago de Tarjeta de Crédito
                </span>
                <h2 id="titulo-pantalla" class="text-3xl font-extrabold text-slate-800 mt-3 transition-all">Ingrese el monto a cancelar</h2>
            </div>

            <!-- CONTENEDOR DE MENSAJES -->
            <div id="mensaje-alerta" class="hidden w-full max-w-lg mb-6 p-3 text-sm font-bold rounded-xl text-center shadow-sm"></div>

            <!-- FASE 1: INGRESO DE MONTO -->
            <div id="fase-ingreso" class="w-full flex flex-col items-center transition-all duration-300">
                <div class="bg-slate-900/80 border border-slate-700 rounded-2xl p-6 w-full max-w-lg shadow-inner flex flex-col items-center mb-6 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-900 via-emerald-400 to-emerald-900"></div>
                    
                    <span class="text-emerald-400 text-xs font-bold uppercase tracking-widest mb-4">
                        Valor en dólares ($)
                    </span>

                    <div class="relative w-full mb-4">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-6 text-3xl font-bold text-slate-400">$</span>
                        <input type="text" id="monto" readonly placeholder="0.00"
                            class="w-full bg-slate-50 text-slate-900 text-3xl font-bold text-center py-4 pl-10 pr-6 rounded-xl border-2 border-slate-300 focus:border-emerald-500 focus:outline-none shadow-inner">
                    </div>

                    <div class="flex justify-between w-full text-xs font-semibold text-slate-400 px-2">
                        <span>[ENTER] Confirmar</span>
                        <span>[ESC] Cancelar</span>
                    </div>
                </div>

                <div class="flex gap-4 w-full max-w-lg">
                    <button onclick="cancelarOperacion()" class="flex-1 bg-slate-100 hover:bg-red-50 border border-slate-200 hover:border-red-500 text-slate-700 hover:text-red-700 font-bold py-3.5 px-6 rounded-xl shadow-sm hover:shadow-md transition-all duration-200 active:scale-[0.98]">
                        Cancelar (ESC)
                    </button>
                    <button onclick="procesarPago()" class="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-md hover:shadow-lg transition-all duration-200 active:scale-[0.98]">
                        Confirmar Pago (ENTER)
                    </button>
                </div>
            </div>

            <!-- FASE 2: DECISIÓN DE RECIBO (Oculto por defecto) -->
            <div id="fase-recibo" class="hidden w-full max-w-lg flex-col items-center transition-all duration-300">
                <div class="flex gap-4 w-full mt-2">
                    <button onclick="procesarRecibo(true)" class="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold py-4 px-6 rounded-xl shadow-md transition-all duration-200 active:scale-[0.98] flex items-center justify-between group">
                        <span class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-900/30 text-white text-lg font-black">1</span>
                        <span class="text-lg pr-4">Sí, imprimir</span>
                    </button>
                    <button onclick="procesarRecibo(false)" class="flex-1 bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 font-bold py-4 px-6 rounded-xl shadow-sm transition-all duration-200 active:scale-[0.98] flex items-center justify-between group">
                        <span class="text-lg pl-2">No, gracias</span>
                        <span class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-300 text-slate-700 text-lg font-black">2</span>
                    </button>
                </div>
                <div class="text-xs font-semibold text-slate-500 mt-6">
                    Presione 1 o 2 en su teclado numérico.
                </div>
            </div>

        </div>
    </main>

    <!-- FOOTER GENERAL -->
    <footer class="bg-slate-900/90 border-t border-slate-800 text-slate-400 px-10 py-3 flex items-center justify-between text-xs z-10 shrink-0">
        <div class="font-bold text-slate-300">CajeBank ATM v2.4</div>
        <div class="text-right text-slate-600">
            © 2026 Sistema de Cajero Automático. Todos los derechos reservados.
        </div>
    </footer>

    <!-- LÓGICA DE TECLADO, AJAX Y DECISIÓN -->
    <script>
        let currentInput = "";
        let procesando = false;
        let faseActual = 1; // 1 = Ingreso, 2 = Pregunta Recibo
        let urlPDFPendiente = "";
        
        const inputField = document.getElementById('monto');

        function mostrarAlerta(mensaje, esExito = false) {
            const alerta = document.getElementById('mensaje-alerta');
            alerta.textContent = mensaje;
            if (esExito) {
                alerta.className = "w-full max-w-lg mb-6 p-3 text-sm font-bold text-emerald-800 bg-emerald-100 border border-emerald-300 rounded-xl text-center shadow-sm";
            } else {
                alerta.className = "w-full max-w-lg mb-6 p-3 text-sm font-bold text-red-700 bg-red-100 border border-red-300 rounded-xl text-center shadow-sm";
            }
            alerta.classList.remove('hidden');
        }

        async function procesarPago() {
            if (procesando || currentInput === "" || currentInput === "0" || currentInput === "0.") return;
            
            const monto = parseFloat(currentInput);
            if (isNaN(monto) || monto <= 0) {
                mostrarAlerta('Por favor ingrese un monto válido mayor a $0.00.', false);
                return;
            }

            procesando = true;

            try {
                const response = await fetch('/api/procesar_pago_tarjeta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ monto: monto })
                });

                const data = await response.json();
                
                if (data.success) {
                    mostrarAlerta(data.message, true);
                    urlPDFPendiente = `/imprimir_recibo_tarjeta/${monto}`;
                    
                    // Transición suave hacia la pregunta del recibo
                    setTimeout(() => {
                        document.getElementById('fase-ingreso').classList.add('hidden');
                        document.getElementById('fase-recibo').classList.remove('hidden');
                        document.getElementById('fase-recibo').classList.add('flex');
                        
                        document.getElementById('mensaje-alerta').classList.add('hidden');
                        
                        const badge = document.getElementById('badge-pantalla');
                        badge.innerText = "Transacción Exitosa";
                        badge.classList.replace('text-emerald-700', 'text-blue-700');
                        badge.classList.replace('bg-emerald-100', 'bg-blue-100');
                        
                        document.getElementById('titulo-pantalla').innerText = "¿Desea imprimir su comprobante?";
                        
                        faseActual = 2;
                        procesando = false;
                    }, 1800);
                } else {
                    mostrarAlerta(data.message, false);
                    procesando = false;
                }
            } catch (error) {
                mostrarAlerta('Error de conexión con el servidor.', false);
                procesando = false;
            }
        }

        function procesarRecibo(imprimir) {
            if (procesando) return;
            procesando = true;

            if (imprimir && urlPDFPendiente) {
                const enlace = document.createElement('a');
                enlace.href = urlPDFPendiente;
                enlace.download = '';
                document.body.appendChild(enlace);
                enlace.click();
                document.body.removeChild(enlace);
            }
            
            mostrarAlerta(imprimir ? "Imprimiendo recibo..." : "Finalizando transacción...", true);
            
            setTimeout(() => {
                window.location.href = '/saldo_movimientos';
            }, 1500);
        }

        function cancelarOperacion() {
            window.location.href = '/menu';
        }

        // Intercepción global de teclado
        document.addEventListener('keydown', function(event) {
            if (procesando) return;
            const key = event.key;

            if (faseActual === 1) {
                if (key === 'Escape') {
                    cancelarOperacion();
                } 
                else if (key === 'Backspace') {
                    event.preventDefault();
                    currentInput = currentInput.slice(0, -1);
                    inputField.value = currentInput ? currentInput : "";
                } 
                else if ((key >= '0' && key <= '9') || key === '.') {
                    if (key === '.' && currentInput.includes('.')) return;
                    
                    if (currentInput === "" && key === '.') {
                        currentInput = "0.";
                    } else if (currentInput === "0" && key >= '0' && key <= '9') {
                        currentInput = key; 
                    } else {
                        if (currentInput.includes('.')) {
                            const partes = currentInput.split('.');
                            if (partes[1] && partes[1].length >= 2) return;
                        }
                        if (currentInput.length < 7) { 
                            currentInput += key;
                        }
                    }
                    inputField.value = currentInput;
                } 
                else if (key === 'Enter') {
                    procesarPago();
                }
            } 
            else if (faseActual === 2) {
                // Decisiones para Fase 2 (1 = Sí, 2 = No)
                if (key === '1') {
                    procesarRecibo(true);
                } else if (key === '2' || key === 'Escape') {
                    procesarRecibo(false);
                }
            }
        });
    </script>

    <!-- MÓDULO DE SEGURIDAD Y UX (INACTIVIDAD Y SONIDO) -->
    <script>
        (function() {
            const TIEMPO_INACTIVIDAD = 30000; 
            let temporizador;

            function reiniciarTemporizador() {
                clearTimeout(temporizador);
                temporizador = setTimeout(() => {
                    alert("Por su seguridad, la sesión ha sido cerrada por inactividad.");
                    window.location.href = '/logout';
                }, TIEMPO_INACTIVIDAD);
            }

            const AudioContext = window.AudioContext || window.webkitAudioContext;
            let contextoAudio;

            function reproducirBeep() {
                if (!contextoAudio) {
                    contextoAudio = new AudioContext();
                }
                if (contextoAudio.state === 'suspended') {
                    contextoAudio.resume();
                }

                const oscilador = contextoAudio.createOscillator();
                const ganancia = contextoAudio.createGain();

                oscilador.type = 'sine';
                oscilador.frequency.setValueAtTime(880, contextoAudio.currentTime);
                ganancia.gain.setValueAtTime(0.05, contextoAudio.currentTime);
                
                oscilador.connect(ganancia);
                ganancia.connect(contextoAudio.destination);
                
                oscilador.start();
                oscilador.stop(contextoAudio.currentTime + 0.1);
            }

            function registrarInteraccion(e) {
                if (e.type === 'keydown' || (e.type === 'mousedown' && e.button === 0)) {
                    reproducirBeep();
                }
                reiniciarTemporizador();
            }

            document.addEventListener('keydown', registrarInteraccion);
            document.addEventListener('mousedown', registrarInteraccion);
            document.addEventListener('mousemove', reiniciarTemporizador);

            reiniciarTemporizador();
        })();
    </script>
</body>
</html>
