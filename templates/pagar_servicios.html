<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CajeBank - Pago de Servicios</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background-color: #0b1329;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .btn-opcion {
            transition: all 0.2s ease-in-out;
        }
        .btn-opcion:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between m-0 p-0 text-slate-800">

    <!-- Barra Superior -->
    <header class="w-full px-8 py-5 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-[#10b981] text-white font-bold rounded-xl w-10 h-10 flex items-center justify-center text-xl shadow-lg">
                $
            </div>
            <div>
                <h1 class="text-white text-2xl font-bold tracking-wide leading-none">CajeBank</h1>
                <span class="text-xs text-[#10b981] font-semibold tracking-wider uppercase">RED DE CAJEROS MULTIBANCO</span>
            </div>
        </div>
        <div class="flex items-center space-x-2 bg-[#132238] border border-slate-700 px-4 py-2 rounded-full shadow-inner">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-xs font-semibold text-slate-200 tracking-wider">OPERATIVO</span>
        </div>
    </header>

    <!-- Contenedor Principal (Pantalla del Cajero) -->
    <main class="flex-grow flex items-center justify-center px-4 py-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-4xl p-8 md:p-12 border border-slate-100 flex flex-col items-center relative">
            
            <!-- Etiqueta superior de sección -->
            <div class="bg-[#e6f4ea] text-[#137333] font-semibold text-xs px-4 py-1.5 rounded-full uppercase tracking-wider mb-3">
                PAGO DE SERVICIOS
            </div>

            <!-- Título Principal -->
            <h2 class="text-2xl md:text-3xl font-bold text-slate-900 mb-8 text-center tracking-tight">
                Seleccione el servicio a pagar
            </h2>

            <!-- Alertas dinámicas -->
            <div id="mensaje-alerta" class="hidden mb-6 px-6 py-3 rounded-xl text-white font-medium text-center shadow-md transition-all duration-300 max-w-md w-full"></div>

            <!-- Cuadrícula de Opciones de Servicios (4 botones principales) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-3xl mb-8">
                
                <!-- Botón 1: Energía Eléctrica -->
                <button onclick="seleccionarServicio('luz')" class="btn-opcion bg-slate-50 border border-slate-200 hover:border-emerald-500 hover:bg-emerald-50/30 p-4 rounded-2xl flex items-center justify-between shadow-sm group">
                    <span class="bg-[#0b1329] text-white font-bold w-9 h-9 rounded-xl flex items-center justify-center text-sm shadow">1</span>
                    <span class="text-lg font-bold text-slate-800 group-hover:text-emerald-700 pr-2">Energía Eléctrica (Luz)</span>
                </button>

                <!-- Botón 3: Internet / Telefonía -->
                <button onclick="seleccionarServicio('internet')" class="btn-opcion bg-slate-50 border border-slate-200 hover:border-emerald-500 hover:bg-emerald-50/30 p-4 rounded-2xl flex items-center justify-between shadow-sm group">
                    <span class="text-lg font-bold text-slate-800 group-hover:text-emerald-700 pl-2">Internet / Telefonía</span>
                    <span class="bg-[#0b1329] text-white font-bold w-9 h-9 rounded-xl flex items-center justify-center text-sm shadow">3</span>
                </button>

                <!-- Botón 2: Agua Potable -->
                <button onclick="seleccionarServicio('agua')" class="btn-opcion bg-slate-50 border border-slate-200 hover:border-emerald-500 hover:bg-emerald-50/30 p-4 rounded-2xl flex items-center justify-between shadow-sm group">
                    <span class="bg-[#0b1329] text-white font-bold w-9 h-9 rounded-xl flex items-center justify-center text-sm shadow">2</span>
                    <span class="text-lg font-bold text-slate-800 group-hover:text-emerald-700 pr-2">Agua Potable</span>
                </button>

                <!-- Botón 4: Cancelar (Volver) -->
                <button onclick="cancelarOperacion()" class="btn-opcion bg-red-50 border border-red-200 hover:bg-red-100 p-4 rounded-2xl flex items-center justify-between shadow-sm group">
                    <span class="text-lg font-bold text-red-700 pl-2">Cancelar (Volver)</span>
                    <span class="bg-red-600 text-white font-bold w-9 h-9 rounded-xl flex items-center justify-center text-sm shadow">4</span>
                </button>

            </div>

            <!-- Pie dentro de la tarjeta -->
            <div class="text-xs text-slate-400 font-medium tracking-wide flex items-center space-x-1">
                <span>Presione la tecla numérica correspondiente o presione</span>
                <span class="bg-slate-100 border border-slate-300 px-2 py-0.5 rounded text-slate-600 font-bold shadow-2xs">ESC</span>
                <span>para salir</span>
            </div>

        </div>
    </main>

    <!-- Pie de Página Institucional -->
    <footer class="w-full px-8 py-4 flex justify-between items-center text-xs text-slate-400">
        <div>
            <span class="text-slate-300 font-semibold">CajeBank ATM v2.4</span>
        </div>
        <div>
            <span>© 2026 Sistema de Cajero Automático. Todos los derechos reservados.</span>
        </div>
    </footer>

    <!-- Lógica JavaScript -->
    <script>
        function seleccionarServicio(servicio) {
            // Redirige o procesa según el servicio seleccionado
            window.location.href = `/pagar_servicio_detalle?tipo=${servicio}`;
        }

        function cancelarOperacion() {
            window.location.href = '/menu';
        }
    </script>
</body>
</html>
