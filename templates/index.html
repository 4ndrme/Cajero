<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CajeBank - Bienvenido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .bg-grid {
            background-size: 30px 30px;
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-slate-900 h-screen flex flex-col justify-between overflow-hidden relative bg-grid select-none">

    <!-- LUCES DE FONDO AMBIENTALES -->
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-emerald-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-teal-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- HEADER -->
    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700/60 text-white px-10 py-4 flex items-center justify-between z-10 shadow-lg shrink-0">
        <div class="flex items-center gap-4">
            <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-900/40 border border-emerald-300/30">
                <span class="text-white text-2xl font-extrabold">$</span>
            </div>
            <div>
                <h1 class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-300">CajeBank</h1>
                <p class="text-xs text-emerald-400 font-semibold tracking-widest uppercase">Sistema de Cajero Automático</p>
            </div>
        </div>
        <div class="text-sm font-bold text-slate-300 tracking-wider uppercase bg-slate-900/60 border border-slate-700/50 px-4 py-2 rounded-full flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            Terminal Activo
        </div>
    </header>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 flex flex-col items-center justify-center px-8 py-4 z-10 min-h-0 overflow-y-auto">
        <div class="w-full max-w-md glass-card rounded-3xl p-8 shadow-2xl border border-white/20 flex flex-col justify-between gap-6">
            
            <div class="text-center">
                <div class="w-16 h-16 rounded-2xl bg-slate-900 text-emerald-400 flex items-center justify-center mx-auto mb-4 border border-slate-700 shadow-md">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-black text-slate-800 tracking-tight">Inserte su Tarjeta</h2>
                <p class="text-xs text-slate-500 font-semibold mt-1">Ingrese su número de tarjeta para iniciar</p>
            </div>

            <!-- CONTENEDOR DE MENSAJES DE ERROR -->
            <div id="error-message" class="hidden p-3 text-xs font-bold text-red-700 bg-red-100 border border-red-300 rounded-xl text-center shadow-sm"></div>

            <!-- FORMULARIO VÍA AJAX -->
            <form id="form-tarjeta" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2" for="tarjeta">
                        Número de Tarjeta
                    </label>
                    <input type="text" id="tarjeta" required autocomplete="off" placeholder="Ej: 123456789" autofocus
                           class="w-full px-4 py-3.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all text-center tracking-widest text-lg">
                </div>

                <button type="submit" id="btn-submit" class="w-full mt-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-extrabold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-900/20 transition-all duration-200 transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2">
                    <span>Continuar</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                    </svg>
                </button>
            </form>

            <!-- ENLACE A REGISTRO -->
            <div class="text-center pt-2 border-t border-slate-200/80">
                <a href="/registro" class="inline-flex items-center gap-1 text-xs font-bold text-emerald-600 hover:text-emerald-800 hover:underline transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                    </svg>
                    <span>¿No tienes tarjeta registrada? Crea una aquí</span>
                </a>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-slate-900/90 border-t border-slate-800 text-slate-400 px-10 py-3 flex items-center justify-between text-xs z-10 shrink-0">
        <div class="font-bold text-slate-300">CajeBank ATM v2.4</div>
        <div class="text-right text-slate-600">
            © 2026 Sistema de Cajero Automático. Todos los derechos reservados.
        </div>
    </footer>

    <!-- LÓGICA DE ENVÍO Y VALIDACIÓN -->
    <script>
        document.getElementById('form-tarjeta').addEventListener('submit', async function(e) {
            e.preventDefault();
            const tarjetaInput = document.getElementById('tarjeta').value.trim();
            const errorDiv = document.getElementById('error-message');
            const btnSubmit = document.getElementById('btn-submit');

            errorDiv.classList.add('hidden');
            btnSubmit.disabled = true;
            btnSubmit.classList.add('opacity-50');

            try {
                const response = await fetch('/api/validar_tarjeta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tarjeta: tarjetaInput })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    window.location.href = data.redirect;
                } else {
                    errorDiv.innerText = data.message || 'Ocurrió un error al validar la tarjeta.';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerText = 'Error de conexión con el servidor.';
                errorDiv.classList.remove('hidden');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.classList.remove('opacity-50');
            }
        });
    </script>

</body>
</html>
