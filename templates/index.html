<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CajeBank - Inicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Patrón de puntos decorativos para el fondo */
        .bg-dots {
            background-image: radial-gradient(#2d6a4f 2px, transparent 2px);
            background-size: 30px 30px;
        }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans overflow-hidden">

    <!-- HEADER -->
    <header class="bg-[#1b5e20] text-white px-8 py-5 flex items-center justify-between shadow-md z-10">
        <div class="flex items-center gap-3">
            <!-- Icono de Moneda -->
            <div class="w-12 h-12 rounded-full border-2 border-black flex items-center justify-center bg-[#1b5e20]">
                <span class="text-black text-2xl font-bold">$</span>
            </div>
            <h1 class="text-4xl font-bold tracking-wide">CajeBank</h1>
        </div>
        <div class="text-xl tracking-wider font-medium uppercase">
            Bienvenido, Tu Cajero, Tu Aliado
        </div>
    </header>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 relative flex flex-col items-center justify-center">
        
        <!-- Decoraciones de fondo (esquinas) -->
        <div class="absolute top-0 left-0 w-64 h-64 bg-dots opacity-20" style="clip-path: circle(50% at 0 0);"></div>
        <div class="absolute top-10 right-10 w-48 h-32 bg-dots opacity-30"></div>
        <div class="absolute bottom-10 left-10 w-48 h-32 bg-dots opacity-30"></div>

        <!-- TARJETA DE INGRESO (UI Principal) -->
        <div class="bg-[#1e8b4d] rounded-2xl p-8 w-full max-w-md shadow-2xl z-10 border border-[#1b5e20]">
            <h2 class="text-white text-4xl font-bold text-center mb-6 tracking-wide border-b border-[#2d6a4f] pb-4">INICIO</h2>
            
            <!-- Input readonly: solo se llena interceptando el teclado -->
            <input type="text" id="tarjeta-input" readonly
                class="w-full py-4 px-4 rounded-xl text-gray-800 text-lg focus:outline-none mb-6 shadow-inner text-center font-mono tracking-widest placeholder-gray-400 cursor-default"
                placeholder="Numero de tarjeta">
            
            <button id="btn-ingresar" 
                class="w-full bg-[#00c853] hover:bg-[#00e676] text-white font-bold text-xl py-4 rounded-full shadow-lg transition-transform duration-150 active:scale-95">
                INGRESAR
            </button>
        </div>

        <!-- ICONO DE MANOS (Apretón) -->
        <div class="mt-12 z-10 opacity-90">
            <svg class="w-32 h-32 text-black" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <!-- Dibujo simplificado de handshake -->
                <path d="M14.4 14.4l-4.8 4.8-3.6-3.6 4.8-4.8"></path>
                <path d="M14.4 14.4l3.6 3.6 3.6-3.6-4.8-4.8"></path>
                <path d="M9.6 9.6l-3.6-3.6-4.8 4.8 3.6 3.6"></path>
                <path d="M9.6 9.6l4.8-4.8 3.6 3.6-4.8 4.8"></path>
                <path d="M12 2v2"></path>
                <path d="M8 3.5l1.5 1.5"></path>
                <path d="M16 3.5l-1.5 1.5"></path>
            </svg>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#1b5e20] text-white px-8 py-4 flex items-center justify-between text-sm shadow-inner z-10">
        <div class="text-xl font-bold">CajeBank</div>
        <div class="text-right">
            <p>© 2026 Sistema de Cajero</p>
            <p>Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- LÓGICA DEL TECLADO -->
    <script>
        let currentInput = "";
        const inputField = document.getElementById('tarjeta-input');
        const btnIngresar = document.getElementById('btn-ingresar');

        // Efecto visual al presionar Enter
        function simulateEnterClick() {
            btnIngresar.classList.add('scale-95', 'bg-[#00e676]');
            setTimeout(() => {
                btnIngresar.classList.remove('scale-95', 'bg-[#00e676]');
            }, 150);
        }

        // Intercepción del teclado a nivel de documento
        document.addEventListener('keydown', function(event) {
            const key = event.key;

            // Prevenir comportamientos por defecto que puedan mover la pantalla
            if (key === 'Backspace') {
                event.preventDefault();
            }

            // Lógica de números (0-9)
            if (key >= '0' && key <= '9') {
                if (currentInput.length < 16) { // Límite de tarjeta
                    currentInput += key;
                    inputField.value = currentInput;
                }
            } 
            // Tecla Enter
            else if (key === 'Enter') {
                if (currentInput.length > 0) {
                    simulateEnterClick();
                    
                    // Petición AJAX al backend para validar la tarjeta
                    fetch('/api/validar_tarjeta', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ tarjeta: currentInput })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            // Si la tarjeta es válida, el backend nos da la URL de redirección
                            window.location.href = data.redirect;
                        } else {
                            // Si falla, mostramos un error temporal y limpiamos el input
                            alert(data.message); 
                            currentInput = "";
                            inputField.value = "";
                        }
                    })
                    .catch(error => console.error('Error de conexión:', error));
                }
            }
            // Tecla Retroceso
            else if (key === 'Backspace') {
                currentInput = currentInput.slice(0, -1);
                inputField.value = currentInput;
            } 
            // Tecla Escape (Cancelar todo)
            else if (key === 'Escape') {
                currentInput = "";
                inputField.value = currentInput;
            }
        });

        // Permitir click en el botón con el mouse (por si acaso)
        btnIngresar.addEventListener('click', () => {
            if (currentInput.length > 0) {
                console.log("Enviando número de tarjeta al backend (Mouse Click): ", currentInput);
            }
        });
    </script>
</body>
</html>
