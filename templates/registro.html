<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CajeBank - Registrar Tarjeta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .bg-grid { background-size: 30px 30px; background-image: radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1px); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-slate-900 h-screen flex flex-col justify-between overflow-hidden relative bg-grid select-none">

    <!-- HEADER -->
    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700/60 text-white px-10 py-4 flex items-center justify-between z-10 shadow-lg shrink-0">
        <div class="flex items-center gap-4">
            <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-lg border border-emerald-300/30">
                <span class="text-white text-2xl font-extrabold">$</span>
            </div>
            <div>
                <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-300">CajeBank</h1>
                <p class="text-xs text-emerald-400 font-semibold uppercase">Registro de Nueva Tarjeta</p>
            </div>
        </div>
        <a href="/" class="text-xs font-bold text-slate-300 hover:text-white bg-slate-900/60 border border-slate-700/50 px-4 py-2 rounded-full transition-colors">
            Volver al Login
        </a>
    </header>

    <!-- FORMULARIO DE REGISTRO -->
    <main class="flex-1 flex flex-col items-center justify-center px-8 py-4 z-10 min-h-0 overflow-y-auto">
        <div class="w-full max-w-md glass-card rounded-3xl p-8 shadow-2xl border border-white/20 flex flex-col gap-5">
            
            <div class="text-center">
                <h2 class="text-2xl font-black text-slate-800">Alta de Cliente</h2>
                <p class="text-xs text-slate-500 font-semibold">Crea una tarjeta para hacer pruebas</p>
            </div>

            <div id="alert-msg" class="hidden p-3 text-xs font-bold rounded-xl text-center"></div>

            <form id="form-registro" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nombre Completo</label>
                        <input type="text" id="nombre" required placeholder="Ej: Juan Pérez"
                               class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Cédula / RUC</label>
                        <input type="text" id="cedula" required placeholder="1726070384"
                               class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Número de Tarjeta</label>
                    <input type="text" id="tarjeta" required placeholder="Ej: 1726070384"
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500 text-center tracking-widest">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">PIN (4 dígitos)</label>
                        <input type="password" id="pin" maxlength="4" required placeholder="1234"
                               class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold text-center text-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Saldo Inicial ($)</label>
                        <input type="number" id="saldo" value="500" min="10" step="5" required
                               class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold text-center text-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>

                <button type="submit" id="btn-registrar" class="w-full mt-3 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-extrabold py-3 px-4 rounded-xl shadow-lg hover:from-emerald-700 hover:to-teal-700 transition-all">
                    Registrar e Ingresar
                </button>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('form-registro').addEventListener('submit', async function(e) {
            e.preventDefault();
            const alertDiv = document.getElementById('alert-msg');
            
            const payload = {
                nombre: document.getElementById('nombre').value.trim(),
                cedula: document.getElementById('cedula').value.trim(),
                tarjeta: document.getElementById('tarjeta').value.trim(),
                pin: document.getElementById('pin').value.trim(),
                saldo: document.getElementById('saldo').value
            };

            try {
                const response = await fetch('/api/registrar_tarjeta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    alertDiv.className = "p-3 text-xs font-bold text-emerald-800 bg-emerald-100 border border-emerald-300 rounded-xl text-center";
                    alertDiv.innerText = data.message;
                    alertDiv.classList.remove('hidden');
                    setTimeout(() => window.location.href = '/', 1500);
                } else {
                    alertDiv.className = "p-3 text-xs font-bold text-red-700 bg-red-100 border border-red-300 rounded-xl text-center";
                    alertDiv.innerText = data.message || 'Error al procesar el registro';
                    alertDiv.classList.remove('hidden');
                }
            } catch (err) {
                alertDiv.className = "p-3 text-xs font-bold text-red-700 bg-red-100 border border-red-300 rounded-xl text-center";
                alertDiv.innerText = "Error de conexión con el servidor.";
                alertDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
