<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CajeBank - Cambio de Clave</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .bg-grid {
            background-size: 30px 30px;
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-slate-900 h-screen flex flex-col justify-between overflow-hidden relative bg-grid select-none">

    <!-- LUCES DE FONDO AMBIENTALES -->
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-emerald-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-teal-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- HEADER -->
    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700/60 text-white px-10 py-4 flex items-center justify-between z-10 shadow-lg shrink-0">
        <div class="flex items-center gap-4">
            <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-900/40 border border-emerald-300/30">
                <span class="text-white text-2xl font-extrabold">$</span>
            </div>
            <div>
                <h1 class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-300">CajeBank</h1>
                <p class="text-xs text-emerald-400 font-semibold tracking-widest uppercase">Gestión de Seguridad</p>
            </div>
        </div>
        <div class="flex items-center gap-3 bg-slate-900/60 border border-slate-700/50 px-4 py-2 rounded-full text-xs font-semibold text-slate-300">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>OPERATIVO</span>
        </div>
    </header>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 flex flex-col items-center justify-center px-6 py-4 z-10">
        <div class="w-full max-w-2xl glass-card rounded-3xl p-8 shadow-2xl border border-white/20 flex flex-col items-center relative transition-all duration-300">
            
            <div class="text-center mb-6">
                <span id="badge-fase" class="text-xs font-bold uppercase tracking-widest text-emerald-700 bg-emerald-100 px-3.5 py-1.5 rounded-full">
                    Paso 1: Validación de Identidad
                </span>
                <h2 id="titulo-fase" class="text-3xl font-extrabold text-slate-800 mt-3">Ingrese su número de cédula</h2>
            </div>

            <!-- CONTENEDOR DE MENSAJES -->
            <div id="mensaje-alerta" class="hidden w-full max-w-lg mb-6 p-3 text-sm font-bold rounded-xl text-center shadow-sm"></div>

            <!-- CAJA INTERACTIVA -->
            <div class="bg-slate-900/80 border border-slate-700 rounded-2xl p-6 w-full max-w-lg shadow-inner flex flex-col items-center mb-6 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-900 via-emerald-400 to-emerald-900"></div>
                
                <span id="subtitulo-fase" class="text-emerald-400 text-xs font-bold uppercase tracking-widest mb-4">
                    Identificación del Titular (10 dígitos)
                </span>

                <div class="relative w-full mb-4">
                    <input type="text" id="data-input" readonly placeholder="----------"
                        class="w-full bg-slate-50 text-slate-900 text-3xl font-bold text-center py-4 px-6 rounded-xl border-2 border-slate-300 focus:border-emerald-500 focus:outline-none tracking-widest shadow-inner">
                </div>

                <div class="flex justify-between w-full text-xs font-semibold text-slate-400 px-2">
                    <span>[ENTER] Siguiente</span>
                    <span>[ESC] Cancelar</span>
                </div>
            </div>

            <!-- BOTONES DE ACCIÓN (NAVEGACIÓN POR CLIC) -->
            <div class="flex gap-4 w-full max-w-lg">
                <button onclick="cancelarOperacion()" class="flex-1 bg-slate-100 hover:bg-red-50 border border-slate-200 hover:border-red-500 text-slate-700 hover:text-red-700 font-bold py-3.5 px-6 rounded-xl shadow-sm hover:shadow-md transition-all duration-200 active:scale-[0.98]">
                    Cancelar (ESC)
                </button>
                <button id="btn-accion-principal" onclick="procesarPaso()" class="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-md hover:shadow-lg transition-all duration-200 active:scale-[0.98]">
                    Continuar (ENTER)
                </button>
            </div>

        </div>
    </main>

    <!-- FOOTER GENERAL -->
    <footer class="bg-slate-900/90 border-t border-slate-800 text-slate-400 px-10 py-3 flex items-center justify-between text-xs z-10 shrink-0">
        <div class="font-bold text-slate-300">CajeBank ATM v2.4</div>
        <div class="text-right text-slate-600">
            © 2026 Sistema de Cajero Automático. Todos los derechos reservados.
        </div>
    </footer>

    <!-- LÓGICA DE TECLADO Y MÁQUINA DE ESTADOS -->
    <script>
        let faseActual = 1; // 1 = Cédula, 2 = Nuevo PIN
        let cedulaGuardada = "";
        let currentInput = "";
        let procesando = false;

        const inputField = document.getElementById('data-input');
        const badgeFase = document.getElementById('badge-fase');
        const tituloFase = document.getElementById('titulo-fase');
        const subtituloFase = document.getElementById('subtitulo-fase');
        const btnAccion = document.getElementById('btn-accion-principal');

        function mostrarAlerta(mensaje, esExito = false) {
            const alerta = document.getElementById('mensaje-alerta');
            alerta.textContent = mensaje;
            if (esExito) {
                alerta.className = "w-full max-w-lg mb-6 p-3 text-sm font-bold text-emerald-800 bg-emerald-100 border border-emerald-300 rounded-xl text-center shadow-sm";
            } else {
                alerta.className = "w-full max-w-lg mb-6 p-3 text-sm font-bold text-red-700 bg-red-100 border border-red-300 rounded-xl text-center shadow-sm";
            }
            alerta.classList.remove('hidden');
        }

        function reiniciarAFase1() {
            faseActual = 1;
            cedulaGuardada = "";
            currentInput = "";
            inputField.type = "text";
            inputField.placeholder = "----------";
            inputField.value = "";
            badgeFase.innerText = "Paso 1: Validación de Identidad";
            badgeFase.className = "text-xs font-bold uppercase tracking-widest text-emerald-700 bg-emerald-100 px-3.5 py-1.5 rounded-full";
            tituloFase.innerText = "Ingrese su número de cédula";
            subtituloFase.innerText = "Identificación del Titular (10 dígitos)";
            btnAccion.innerText = "Continuar (ENTER)";
        }

        async function procesarPaso() {
            if (procesando) return;

            // Transición de Fase 1 a Fase 2
            if (faseActual === 1) {
                if (currentInput.length !== 10) {
                    mostrarAlerta('La cédula debe tener exactamente 10 dígitos.', false);
                    return;
                }

                document.getElementById('mensaje-alerta').classList.add('hidden');
                cedulaGuardada = currentInput;
                currentInput = "";
                inputField.value = "";
                inputField.type = "password";
                inputField.placeholder = "****";

                badgeFase.innerText = "Paso 2: Nueva Clave";
                badgeFase.className = "text-xs font-bold uppercase tracking-widest text-blue-700 bg-blue-100 px-3.5 py-1.5 rounded-full";
                tituloFase.innerText = "Defina su nuevo PIN";
                subtituloFase.innerText = "Clave Numérica de Seguridad (4 dígitos)";
                btnAccion.innerText = "Actualizar Clave (ENTER)";
                faseActual = 2;
            }
            // Ejecución de la transacción en Fase 2
            else if (faseActual === 2) {
                if (currentInput.length !== 4) {
                    mostrarAlerta('El nuevo PIN debe tener exactamente 4 dígitos.', false);
                    return;
                }

                procesando = true;

                try {
                    const response = await fetch('/api/procesar_cambio_clave', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            cedula: cedulaGuardada, 
                            nuevo_pin: currentInput 
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        mostrarAlerta(data.message, true);
                        // Por seguridad de cajero, se cierra la sesión tras el cambio de clave
                        setTimeout(() => {
                            window.location.href = '/logout';
                        }, 2500);
                    } else {
                        mostrarAlerta(data.message, false);
                        setTimeout(() => {
                            reiniciarAFase1();
                            procesando = false;
                        }, 2000);
                    }
                } catch (error) {
                    mostrarAlerta('Error de conexión con el servidor.', false);
                    procesando = false;
                }
            }
        }

        function cancelarOperacion() {
            window.location.href = '/menu';
        }

        // Intercepción global de teclado
        document.addEventListener('keydown', function(event) {
            if (procesando) return;
            const key = event.key;

            if (key === 'Escape') {
                cancelarOperacion();
            }
            else if (key === 'Backspace') {
                event.preventDefault();
                currentInput = currentInput.slice(0, -1);
                inputField.value = currentInput ? currentInput : "";
            }
            else if (key >= '0' && key <= '9') {
                const maxLen = (faseActual === 1) ? 10 : 4;
                if (currentInput.length < maxLen) {
                    currentInput += key;
                    inputField.value = currentInput;
                }
            }
            else if (key === 'Enter') {
                procesarPaso();
            }
        });
    </script>
    <!-- MÓDULO DE SEGURIDAD Y UX (INACTIVIDAD Y SONIDO) -->
    <script>
        (function() {
            // 1. Configuración del Temporizador (30 segundos para la simulación)
            const TIEMPO_INACTIVIDAD = 30000; 
            let temporizador;

            function reiniciarTemporizador() {
                clearTimeout(temporizador);
                temporizador = setTimeout(() => {
                    // Mostrar alerta de seguridad y redirigir
                    alert("Por su seguridad, la sesión ha sido cerrada por inactividad.");
                    window.location.href = '/logout';
                }, TIEMPO_INACTIVIDAD);
            }

            // 2. Generador de Sonido (Beep de Cajero Automático)
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            let contextoAudio;

            function reproducirBeep() {
                if (!contextoAudio) {
                    contextoAudio = new AudioContext();
                }
                if (contextoAudio.state === 'suspended') {
                    contextoAudio.resume();
                }

                const oscilador = contextoAudio.createOscillator();
                const ganancia = contextoAudio.createGain();

                oscilador.type = 'sine';
                oscilador.frequency.setValueAtTime(880, contextoAudio.currentTime); // Tono agudo A5
                
                ganancia.gain.setValueAtTime(0.05, contextoAudio.currentTime); // Volumen bajo y elegante
                
                oscilador.connect(ganancia);
                ganancia.connect(contextoAudio.destination);
                
                oscilador.start();
                oscilador.stop(contextoAudio.currentTime + 0.1); // Duración muy corta (100ms)
            }

            // 3. Captura global de eventos
            function registrarInteraccion(e) {
                // Solo pitar si es una tecla válida o un clic izquierdo
                if (e.type === 'keydown' || (e.type === 'mousedown' && e.button === 0)) {
                    reproducirBeep();
                }
                reiniciarTemporizador();
            }

            // Escuchar interacciones en todo el documento
            document.addEventListener('keydown', registrarInteraccion);
            document.addEventListener('mousedown', registrarInteraccion);
            document.addEventListener('mousemove', reiniciarTemporizador); // El mousemove reinicia el tiempo, pero no pita

            // Iniciar el temporizador al cargar la página
            reiniciarTemporizador();
        })();
    </script>
</body>
</html>
