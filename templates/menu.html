<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CajeBank - Menú Principal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #ffffff; 
        }
        .bg-dots {
            background-image: radial-gradient(#1b5e20 3px, transparent 3px);
            background-size: 35px 35px;
        }
        .bg-stripes {
            /* Patrón de líneas diagonales exacto al diseño original */
            background-image: repeating-linear-gradient(45deg, transparent, transparent 4px, #8ba891 4px, #8ba891 5px);
        }
    </style>
</head>
<body class="h-screen flex flex-col font-sans overflow-hidden">

    <!-- HEADER -->
    <header class="bg-[#194f2b] text-white px-8 py-4 flex items-center justify-between z-10 relative">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-full border-[3px] border-black flex items-center justify-center bg-[#194f2b]">
                <span class="text-black text-3xl font-medium">$</span>
            </div>
            <h1 class="text-[2.5rem] font-bold tracking-wide">CajeBank</h1>
        </div>
        <div class="text-[1.3rem] tracking-wide uppercase">
            Bienvenido, Tu Cajero, Tu Aliado
        </div>
    </header>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 relative flex flex-col items-center w-full pt-8">
        
        <!-- DECORACIONES DE FONDO -->
        <!-- Líneas diagonales superior izquierda -->
        <div class="absolute top-0 left-0 w-80 h-40 bg-stripes" style="clip-path: ellipse(100% 100% at 0% 0%);"></div>
        <!-- Puntos superior derecha -->
        <div class="absolute top-6 right-6 w-48 h-24 bg-dots opacity-80"></div>
        <!-- Puntos inferior izquierda -->
        <div class="absolute bottom-6 left-6 w-64 h-32 bg-dots opacity-80"></div>

        <!-- TÍTULO CENTRAL -->
        <div class="bg-[#1b8a47] text-white text-[2.2rem] font-bold rounded-xl py-3 px-16 z-10 mb-10 mt-2">
            Que vamos a hacer hoy?
        </div>

        <!-- CONTENEDOR DEL MENÚ (Sin padding lateral para tocar los bordes) -->
        <div class="w-full flex justify-between items-center z-10 relative mt-4">

            <!-- Columna Izquierda (1, 2, 3) -->
            <div class="flex flex-col gap-6 w-[42vw] max-w-[600px]">
                <!-- Botón 1 -->
                <button id="btn-1" class="bg-[#009c4a] text-white text-[2rem] font-bold py-3 px-6 w-full flex items-center transition-transform duration-150 active:scale-[0.98]">
                    <span class="w-12 text-left">1.</span>
                    <span class="flex-1 text-center pr-12">Retirar</span>
                </button>
                <!-- Botón 2 -->
                <button id="btn-2" class="bg-[#009c4a] text-white text-[2rem] font-bold py-3 px-6 w-full flex items-center transition-transform duration-150 active:scale-[0.98]">
                    <span class="w-12 text-left">2.</span>
                    <span class="flex-1 text-center pr-12">Depositar</span>
                </button>
                <!-- Botón 3 -->
                <button id="btn-3" class="bg-[#009c4a] text-white text-[2rem] font-bold py-3 px-6 w-full flex items-center transition-transform duration-150 active:scale-[0.98]">
                    <span class="w-12 text-left">3.</span>
                    <span class="flex-1 text-center pr-12">Cambio de clave</span>
                </button>
            </div>

            <!-- Icono Central (Apretón de manos) -->
            <div class="flex justify-center absolute left-1/2 transform -translate-x-1/2 opacity-30 mt-6 pointer-events-none">
                <svg class="w-[300px] h-[300px] text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.4 14.4l-4.8 4.8-3.6-3.6 4.8-4.8"></path>
                    <path d="M14.4 14.4l3.6 3.6 3.6-3.6-4.8-4.8"></path>
                    <path d="M9.6 9.6l-3.6-3.6-4.8 4.8 3.6 3.6"></path>
                    <path d="M9.6 9.6l4.8-4.8 3.6 3.6-4.8 4.8"></path>
                    <path d="M12 2v2"></path>
                    <path d="M8 3.5l1.5 1.5"></path>
                    <path d="M16 3.5l-1.5 1.5"></path>
                </svg>
            </div>

            <!-- Columna Derecha (4, 5, 6) -->
            <div class="flex flex-col gap-6 w-[42vw] max-w-[600px]">
                <!-- Botón 4 -->
                <button id="btn-4" class="bg-[#009c4a] text-white text-[2rem] font-bold py-3 px-6 w-full flex items-center transition-transform duration-150 active:scale-[0.98]">
                    <span class="flex-1 text-center pl-12">Pagar servicios</span>
                    <span class="w-12 text-right">4.</span>
                </button>
                <!-- Botón 5 -->
               <button id="btn-5" class="bg-[#009c4a] text-white text-[2rem] font-bold py-3 px-6 w-full flex items-center transition-transform duration-150 active:scale-[0.98]">
                    <span class="flex-1 text-center pl-12 leading-tight">Saldo y<br><span class="text-[1.5rem]">movimientos</span></span>
                    <span class="w-12 text-right">5.</span>
                </button>
                <!-- Botón 6 -->
                <button id="btn-6" class="bg-[#009c4a] text-white text-[2rem] font-bold py-3 px-6 w-full flex items-center transition-transform duration-150 active:scale-[0.98]">
                    <span class="flex-1 text-center leading-tight">Pago de tarjeta<br><span class="text-[1.5rem]">de credito</span></span>
                    <span class="w-12 text-right">6.</span>
                </button>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#194f2b] text-white px-8 py-3 flex items-center justify-between text-sm z-10 relative mt-auto">
        <div class="text-xl font-bold">CajeBank</div>
        <div class="text-right leading-tight">
            <p>© 2026 Sistema de Cajero</p>
            <p>Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- LÓGICA DE TECLADO -->
    <script>
        function simulateButtonPress(buttonId) {
            const btn = document.getElementById(buttonId);
            if (btn) {
                btn.classList.add('bg-[#00e676]');
                setTimeout(() => {
                    btn.classList.remove('bg-[#00e676]');
                }, 150);
            }
        }

        document.addEventListener('keydown', function(event) {
            const key = event.key;

            if (key >= '1' && key <= '6') {
                simulateButtonPress(`btn-${key}`);
                
                if (key === '1') {
                    window.location.href = '/retirar';
                } else if (key === '2') {
                    window.location.href = '/depositar';
                } else if (key === '3') {
                    window.location.href = '/cambiar_clave';
                } else if (key === '4') {
                    window.location.href = '/pagar_servicios'; // <--- Enlace activado
                } else if (key === '5') {
                    window.location.href = '/saldo_movimientos';
                }
            }
        });
    </script>
</body>
</html>
